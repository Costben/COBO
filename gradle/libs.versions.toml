[versions]
agp = "9.3.2"
kotlin = "2.4.10"
compose-multiplatform = "1.12.2"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.1"
coui = "1.2.0-SNAPSHOT"
coil = "3.6.3"
lifecycle = "2.11.0"
navigationevent = "1.2.0"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
media3 = "1.11.1"
okhttp = "4.12.0"
zxing = "3.5.3"
junit = "4.13.2"
orgJson = "20240303"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
